[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
authors = [
  { name="skurita", email="skurita@student.42tokyo.jp" },
  { name="sozawa", email="sozawa@student.42tokyo.jp"}
]
description = "A-Maze-ing maze generator module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "build"
]

[tool.setuptools]
packages = ["mazegen"]
